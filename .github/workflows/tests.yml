# CI/CD: the lint and the headless test suites, then a deploy to GitHub Pages on main.
# GitLab equivalent: a .gitlab-ci.yml with `stages: [test, deploy]` and a
# `pages` job limited to the default branch.
name: tests

on:
  push:
    branches: ['**'] # every branch, so a branch is green before its PR opens
  workflow_dispatch:

# A newer push to a branch cancels the run it makes stale. Never on main,
# where cancelling could stop a deploy halfway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token for every job unless it says otherwise (deploy does).
permissions:
  contents: read

jobs:
  # The four test jobs run in parallel, so CI takes about as long as the
  # slowest. All are skipped on the merge push to main: the "protect main"
  # ruleset only lets a squash merge land from a branch that is up to date and
  # green, so a second run there tests the same code again, and a flake there
  # (run 46063220338) blocked a deploy. "Run workflow" still tests main.
  lint:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint (tests/lint.sh, the same command as locally)
        working-directory: tests
        run: bash lint.sh

  cases:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest # ships Google Chrome at /usr/bin/google-chrome
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: E2E cases (tests/run.sh, the same command as locally)
        working-directory: tests
        run: bash run.sh

  sync:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v4 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: 21
      - name: Sync tests on the Firebase emulators (tests/sync.sh, the same command as locally)
        working-directory: tests
        run: bash sync.sh

  # The runner's own self-test (tests/check-runner.sh): pass, fail, FLAKY,
  # storage isolation on one Chrome, the TEST_CASES guard, the machine-wide
  # lock, serial cases and a failed app open. Needs puppeteer-core and Chrome.
  runner-selftest:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the test dependencies
        working-directory: tests
        run: npm ci --silent --no-audit --no-fund
      - name: Runner self-test (tests/check-runner.sh, the same command as locally)
        working-directory: tests
        run: bash check-runner.sh

  # The check the "protect main" ruleset requires; its name must not change.
  # `always()` because a job skipped after a failed one would count as passing;
  # this one has to fail instead. The one skip it accepts is the merge push to
  # main, where the test jobs are skipped on purpose.
  test:
    needs: [lint, cases, sync, runner-selftest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          merge_push="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          ok() { [ "$1" = success ] || { [ "$merge_push" = true ] && [ "$1" = skipped ]; }; }
          ok "${{ needs.lint.result }}" && ok "${{ needs.cases.result }}" && ok "${{ needs.sync.result }}" && ok "${{ needs.runner-selftest.result }}"

  # The site's files, packed as the "github-pages" artifact. A job of its own,
  # GitHub's starter layout: deploy-pages in the same job looked for the
  # artifact half a second after it was uploaded, found none (GitHub hadn't
  # listed it yet) and failed #44's and #45's deploys. A re-run can't recover
  # from that, since it uploads a second artifact of the same name; start a
  # fresh run instead.
  build:
    needs: test
    # Explicit: the test jobs skipped on the merge push would make the implicit
    # success() skip this job. !cancelled(), not always(): a cancelled run must
    # never deploy.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
